[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-desktop"
version = "0.3.0"
description = "Give an AI agent its own desktop: shell, files, background jobs, web, and a real browser."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Bobbywasabi31" }]
keywords = ["ai", "agent", "desktop", "computer-use", "automation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
browser = ["playwright>=1.40"]
dev = ["pytest>=8", "ruff>=0.9"]

[project.urls]
Homepage = "https://github.com/Bobbywasabi31/Ai-desktop"

[tool.setuptools.packages.find]
where = ["."]
include = ["aidesktop*"]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "SIM", "PERF", "PLW", "RUF", "PYI", "B"]
ignore = [
    # typing.Self only exists in 3.11+; quoted annotations are fine here
    # given `from __future__ import annotations`.
    "PYI034",
]

[tool.ruff.lint.per-file-ignores]
# the demo page embeds long HTML/CSS/JS lines; wrapping them is noise
"examples/*" = ["E501"]
