[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-desktop"
version = "0.1.0"
description = "Give an AI agent its own desktop: shell, files, background jobs, web, and a real browser."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Bobbywasabi31" }]
keywords = ["ai", "agent", "desktop", "computer-use", "automation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
browser = ["playwright>=1.40"]
dev = ["pytest>=8"]

[project.urls]
Homepage = "https://github.com/Bobbywasabi31/Ai-desktop"

[tool.setuptools.packages.find]
where = ["."]
include = ["aidesktop*"]
